<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Aurelia Admin Login</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f7f3ed;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
background:white;
padding:40px;
width:350px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
border:none;
background:#C4A678;
color:white;
cursor:pointer;
}

#message{
margin-top:10px;
color:red;
}

</style>

</head>

<body>

<div class="card">

<h2>AURELIA Admin Login</h2>

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">
LOGIN
</button>

<p id="message"></p>

</div>

<script>

async function login(){

const email =
document.getElementById(
"email"
).value;

const password =
document.getElementById(
"password"
).value;

try{

const response =
await fetch(
"http://localhost:5001/api/auth/login",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

email,
password

})

}
);

const data =
await response.json();

if(data.success){

localStorage.setItem(
"token",
data.token
);

window.location =
"dashboard.html";

}else{

document.getElementById(
"message"
).textContent =
data.message;

}

}catch(error){

document.getElementById(
"message"
).textContent =
"Cannot connect to server";

}

}

</script>

</body>
</html>
