<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AURELIA Dashboard</title>

<style>

:root{
--ivory:#F7F3ED;
--champagne:#E9DFD1;
--green:#26372F;
--gold:#C4A678;
--text:#282724;
}

body{
margin:0;
padding:40px;
font-family:'Segoe UI',sans-serif;
background:var(--ivory);
color:var(--text);
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:35px;
}

.topbar h1{
font-size:3rem;
margin:0;
color:var(--green);
}

.logout{
background:var(--gold);
color:white;
border:none;
padding:12px 16px;
cursor:pointer;
border-radius:8px;
}

.card-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
margin-bottom:40px;
}

.card{
background:white;
padding:30px;
border-radius:18px;
box-shadow:
0 10px 30px rgba(0,0,0,.08);
border:1px solid rgba(196,166,120,.15);
}

.card h4{
margin:0;
color:#777;
font-weight:500;
}

.card h2{
margin-top:15px;
font-size:3rem;
color:var(--green);
}

table{
width:100%;
background:white;
border-radius:20px;
overflow:hidden;
border-collapse:collapse;
box-shadow:
0 10px 30px rgba(0,0,0,.08);
}

thead{
background:var(--green);
color:white;
}

th{
padding:18px;
font-size:.9rem;
letter-spacing:1px;
}

td{
padding:18px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#faf7f3;
}

.status-new{
background:#f0ad4e;
color:white;
padding:6px 14px;
border-radius:30px;
font-size:.85rem;
}

.status-contacted{
background:#3498db;
color:white;
padding:6px 14px;
border-radius:30px;
font-size:.85rem;
}

.status-confirmed{
background:#2ecc71;
color:white;
padding:6px 14px;
border-radius:30px;
font-size:.85rem;
}

button{
border:none;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
margin-right:6px;
}

.contacted{
background:#3498db;
color:white;
}

.confirmed{
background:#2ecc71;
color:white;
}

.delete{
background:#e74c3c;
color:white;
}

.contacted:hover,
.confirmed:hover,
.delete:hover,
.logout:hover{
opacity:.85;
}

@media(max-width:900px){

body{
padding:20px;
}

.topbar{
flex-direction:column;
align-items:flex-start;
gap:15px;
}

.topbar h1{
font-size:2rem;
}

table{
display:block;
overflow-x:auto;
}

}

</style>
</head>

<body>

<div class="topbar">

<h1>AURELIA Dashboard</h1>

<button
class="logout"
onclick="logout()">
Logout
</button>

</div>

<div class="card-grid">

<div class="card">
<h4>Total</h4>
<h2 id="totalCount">0</h2>
</div>

<div class="card">
<h4>New</h4>
<h2 id="newCount">0</h2>
</div>

<div class="card">
<h4>Confirmed</h4>
<h2 id="confirmedCount">0</h2>
</div>

</div>

<table>

<thead>

<tr>

<th>Name</th>
<th>Email</th>
<th>Message</th>
<th>Status</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="inquiryTable">

</tbody>

</table>

<script>

const token =
localStorage.getItem(
"token"
);

if(!token){

window.location =
"login.html";

}

async function loadInquiries(){

try{

const response =
await fetch(
"http://localhost:5001/api/inquiries",
{
headers:{
Authorization:
`Bearer ${token}`
}
}
);

const data =
await response.json();

if(!data.success){

window.location =
"login.html";

return;

}

const table =
document.getElementById(
"inquiryTable"
);

table.innerHTML = "";

let total =
data.inquiries.length;

let newCount = 0;

let confirmed = 0;

data.inquiries.forEach(
(item)=>{

if(item.status==="New")
newCount++;

if(item.status==="Confirmed")
confirmed++;

table.innerHTML += `

<tr>

<td>${item.name}</td>

<td>${item.email}</td>

<td>${item.message}</td>

<td>
<span class="${
item.status === 'Confirmed'
? 'status-confirmed'
: item.status === 'Contacted'
? 'status-contacted'
: 'status-new'
}">
${item.status}
</span>
</td>

<td>

<button
class="contacted"
onclick="updateStatus(
'${item._id}',
'Contacted'
)">
Contacted
</button>

<button
class="confirmed"
onclick="updateStatus(
'${item._id}',
'Confirmed'
)">
Confirm
</button>

<button
class="delete"
onclick="deleteInquiry(
'${item._id}'
)">
Delete
</button>

</td>

</tr>

`;

});

document.getElementById(
"totalCount"
).textContent =
total;

document.getElementById(
"newCount"
).textContent =
newCount;

document.getElementById(
"confirmedCount"
).textContent =
confirmed;

}catch(error){

console.error(error);

alert(
"Please login again."
);

window.location =
"login.html";

}

}

async function updateStatus(
id,
status
){

await fetch(
`http://localhost:5001/api/inquiries/${id}`,
{
method:"PUT",

headers:{
"Content-Type":
"application/json",

Authorization:
`Bearer ${token}`
},

body:JSON.stringify({
status
})

}
);

loadInquiries();

}

async function deleteInquiry(
id
){

const yes =
confirm(
"Delete Inquiry?"
);

if(!yes) return;

await fetch(
`http://localhost:5001/api/inquiries/${id}`,
{
method:"DELETE",

headers:{
Authorization:
`Bearer ${token}`
}
}
);

loadInquiries();

}

function logout(){

localStorage.removeItem(
"token"
);

window.location =
"login.html";

}

loadInquiries();

</script>

</body>
</html>
